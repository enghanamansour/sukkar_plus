name: sukkar_plus
description: >-
  Sukkar Plus (سكر بلس) — independent concept prototype of an Arabic RTL
  diabetes follow-up companion. Not affiliated with Sehhaty or any provider.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sukkar_core:
    path: ../packages/sukkar_core
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  # On-device PDF text extraction (PDFium). MIT licence.
  pdfrx: ^2.10.1
  file_picker: ^13.3.0
  # Visit-summary PDF export.
  pdf: ^3.13.1
  printing: ^5.15.1
  # Optional live backend. Not used in demo mode.
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pure-Dart tests (all test files except widget_test.dart) use package:test.
  test: any

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic_400Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic_500Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic_700Bold.ttf
          weight: 700
